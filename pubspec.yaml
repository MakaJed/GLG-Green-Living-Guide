name: glg_flutter
description: A Flutter remake of the GLG (Green Little Game) eco-friendly game.
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.29.0
  flame_tiled: ^1.13.0
  flame_audio: ^2.1.1
  provider: ^6.0.5
  cupertino_icons: ^1.0.5
  audioplayers: ^5.2.0
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/player/
    - assets/images/npc/
    - assets/images/trash/
    - assets/images/monsters/
    - assets/images/background/
    - assets/images/ui/
    - assets/tiles/
    - assets/audio/
